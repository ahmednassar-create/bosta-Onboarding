<style>
/* Layout: sticky control bar (date, language, tabs) over one column. Everything is grouped by team: Team 1, Team 2, Team 3, Temp. Each team shows its Super, its scores, then its people. Dashboard = KPI strip + one table per team. Daily check = one card per person with a 3-way control per task. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15212e; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#b02018; --accent-ink:#ffffff; --accent-soft:#fbe3e0;
  --ok:#1b8a57; --ok-soft:#dcf3e7; --warn:#a56a00; --warn-soft:#fbefd0; --bad:#c0352d; --bad-soft:#fbe1de; --na:#8a96a3; --na-soft:#e8ecf0;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --ink:#e7edf3; --muted:#93a1b0; --line:#2a3745;
  --accent:#ff5a4d; --accent-ink:#1d0705; --accent-soft:#3a1714;
  --ok:#47c88a; --ok-soft:#14352a; --warn:#e3a93a; --warn-soft:#3a2f12; --bad:#ff7b72; --bad-soft:#3d1d1b; --na:#8795a4; --na-soft:#222d38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --ink:#e7edf3; --muted:#93a1b0; --line:#2a3745;
  --accent:#ff5a4d; --accent-ink:#1d0705; --accent-soft:#3a1714;
  --ok:#47c88a; --ok-soft:#14352a; --warn:#e3a93a; --warn-soft:#3a2f12; --bad:#ff7b72; --bad-soft:#3d1d1b; --na:#8795a4; --na-soft:#222d38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.bar .id{display:flex;flex-direction:column;gap:2px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.date{display:inline-flex;align-items:center;gap:6px}
.date button,.date input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.date input{font-family:var(--mono);font-size:13px}
.date button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.bad{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:9px 14px;background:var(--bg);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end}
td.mono{font-family:var(--mono);font-size:13px}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-weight:600}.who span{color:var(--muted);font-size:12px}
.arn{color:var(--muted);font-weight:400;font-size:12px}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .t{flex:1;height:8px;border-radius:4px;background:var(--na-soft);overflow:hidden}
.meter .f{display:block;height:100%;border-radius:4px}
.meter b{font-family:var(--mono);font-size:13px;min-width:42px;text-align:end;font-weight:600}
.f.ok{background:var(--ok)}.f.warn{background:var(--warn)}.f.bad{background:var(--bad)}.f.na{background:var(--na)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.na{background:var(--na-soft);color:var(--na)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.team{display:flex;flex-direction:column;gap:12px}
.thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;border-inline-start:5px solid var(--accent)}
.panel>.thead{border:0;border-bottom:1px solid var(--line);border-radius:0;border-inline-start:5px solid var(--accent)}
.thead .who{flex:1;min-width:160px}
.tm{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.tm>div{display:flex;flex-direction:column;gap:2px}
.tm small{color:var(--muted);font-size:11px}
.gcount{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.3}
.gcount.ok{color:var(--ok)}.gcount.bad{color:var(--bad)}
.fold{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;width:30px;height:30px;cursor:pointer;flex:none}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card .meter{min-width:110px}
.task{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .name{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column}
.task .name small{color:var(--muted);font-size:11px}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;direction:ltr}
.tri button{font:inherit;font-size:13px;font-weight:600;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 11px;cursor:pointer;min-width:40px}
.tri button:first-child{border-left:0}
.tri button[data-v="d"][aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.tri button[data-v="m"][aria-pressed="true"]{background:var(--bad);color:var(--surface)}
.tri button[data-v="n"][aria-pressed="true"]{background:var(--na);color:var(--surface)}
.tri button:disabled{cursor:default;opacity:.55}
.vacant{padding:14px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12px}
.gaps{border-top:1px solid var(--line);background:var(--bg);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gap{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.gap.done{opacity:.6}.gap.done .gt span{text-decoration:line-through}
.gck{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);background:var(--surface);color:var(--surface);font-weight:700;cursor:pointer;line-height:1;padding:0}
.gck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.gck:disabled{cursor:default;opacity:.55}
.gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.gt small{color:var(--muted);font-size:11px}
.gx{flex:none;font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.gx.conf{color:var(--bad);border-color:var(--bad)}
.gx:disabled{cursor:default;opacity:.5}
.gform{display:flex;flex-direction:column;gap:6px}
.gform input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.gform button{align-self:flex-start;font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
.gform button:disabled,.gform input:disabled{opacity:.5;cursor:default}
.rp{margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:2px}
.rp.a{border-inline-start:3px solid var(--accent)}
.rp b{font-size:12px;color:var(--muted)}
.rp small{color:var(--muted)}
.rform{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.rform input{flex:1;min-width:140px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.rform button{font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.gl{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.btn{font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warnb{background:var(--warn);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel>header.rhead{align-items:center}
.rhead .ctrls{align-items:center}
.aform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
.aform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.aform input,.aform select,#mon{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.aform .btn{justify-self:start}
.rolelist{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.rolelist div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rolelist b{min-width:110px}
body{background-image:radial-gradient(900px 380px at 0% -80px,rgba(224,0,16,.14),transparent 70%),radial-gradient(800px 360px at 100% -60px,rgba(0,152,160,.16),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
.bar{background:transparent!important;border-bottom-color:transparent!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.bar .id{flex-direction:row;align-items:center;gap:14px}
.bar .idt{display:flex;flex-direction:column;gap:2px;min-width:0}
.subnav{align-self:flex-start}
.dtrole{margin-top:10px}
.dt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt .btn{padding:4px 10px;font-size:12px}
.offbar{display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{height:34px;width:auto;flex:none;display:block}
@media (prefers-reduced-motion:no-preference){.logo{animation:blink 2.4s ease-in-out infinite}}
@keyframes blink{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(224,0,16,0))}50%{opacity:.3;filter:drop-shadow(0 0 9px rgba(224,0,16,.75))}}
.chip[data-team]:not([data-team="all"]){border-color:var(--tc);box-shadow:inset 0 -3px 0 var(--tc)}
.chip[data-team]:not([data-team="all"])[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:none}
.thead{border-inline-start-color:var(--tc,var(--accent))!important}
.thead h2{color:var(--tc,var(--ink))}
.team .card{border-top:3px solid var(--tc,var(--line))}
#view{display:flex;flex-direction:column;gap:22px}
.panel[style*="--tc"]{border:2px solid var(--tc);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);background:color-mix(in srgb,var(--tc) 5%,var(--surface))}
.panel[style*="--tc"]>.thead{background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.team[style*="--tc"]{border:2px solid var(--tc);border-radius:14px;padding:14px;background:color-mix(in srgb,var(--tc) 5%,var(--surface));box-shadow:0 6px 18px rgba(0,0,0,.08)}
.team[style*="--tc"]>.thead{background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
@media (max-width:520px){h1{font-size:19px}.kpi .v{font-size:26px}.task{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.meter .f{transition:width .25s ease}}
</style>
